# タグ (v0.1.1 など) を push すると、Windows 用インストーラをビルド・署名して
# GitHub Releases に公開し、アプリの自動更新が読む latest.json も一緒に出します。
#
# 事前準備 (一度だけ):
#   1. npm run tauri signer generate -- -w %USERPROFILE%\.tauri\luna.key
#   2. node scripts/setup-updater.mjs OWNER/REPO      (公開鍵と更新先を tauri.conf.json に書く)
#   3. リポジトリの Settings → Secrets and variables → Actions に登録:
#        TAURI_SIGNING_PRIVATE_KEY           luna.key の中身
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD  鍵のパスワード (空なら空文字)
#   4. Settings → Actions → General → Workflow permissions を "Read and write" にする
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm-workspace.yaml uses a newer pnpm's settings (allowBuilds), which pnpm 9 rejects
      # ("packages field missing or empty"), so use the current pnpm.
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Build as the version of the tag, whatever the files in the commit say: this sets
      # package.json, tauri.conf.json, Cargo.toml and Cargo.lock, which decides the installer's
      # file name, the version Luna shows and the version the updater compares.
      - name: Set the version from the tag
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # The release's text is this version's entry in src/patchNotes.json (the same text the app
      # shows after the update). The build fails here if the entry is missing.
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node scripts/release-notes.mjs "$GITHUB_REF_NAME"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Luna ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
